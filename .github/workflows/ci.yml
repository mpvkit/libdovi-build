name: CI Test

on:
  push:
    branches:
      - ci
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag name (default libdovi version)'
        default: ''

jobs:
  build:
    permissions:
      contents: write
    uses: mpvkit/BuildShared/.github/workflows/build.yml@main
    secrets: inherit
    with:
      version: '${{ github.event.inputs.version }}'
      library: 'libdovi'
      try_run: true
